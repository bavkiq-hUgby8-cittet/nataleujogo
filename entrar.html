<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="jogos-raiz" content="">
    <meta name="jogos-papel" content="convidado">
    <meta name="theme-color" content="#17212b">
    <title>Entrar com código · Jogos de Família</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/plataforma.css?v=3">
</head>
<body>
    <main class="auth-caixa">
        <a class="marca" href="index.html">Jogos de Família</a>
        <h1>Entrar na partida</h1>
        <p class="nota">Digite o código de 8 letras que está na TV. Não precisa criar conta.</p>
        <form id="form-codigo" class="formulario cartao">
            <label for="codigo">Código</label>
            <input id="codigo" name="codigo" inputmode="latin" autocomplete="off" maxlength="8" minlength="8" required placeholder="Ex.: K7M2Q9PX">
            <button class="botao" type="submit">Continuar</button>
            <p id="erro" class="erro" hidden></p>
        </form>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js?v=3"></script>
    <script src="js/firebase.js?v=3"></script>
    <script src="js/plataforma.js?v=3"></script>
    <script>
        const form = document.getElementById('form-codigo');
        const erro = document.getElementById('erro');
        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            erro.hidden = true;
            if (!window.JogosFirebase?.podeConectar) {
                erro.hidden = false;
                erro.textContent = 'O Firebase desta página ainda não foi configurado.';
                return;
            }
            const codigo = document.getElementById('codigo').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            try {
                await Plataforma.entrarConvidado();
                const snap = await Plataforma.banco().ref('codigos/' + codigo).get();
                const dados = snap.val();
                if (!dados || !dados.familia || !dados.partida || !dados.jogo) throw new Error('Código não encontrado.');
                const destino = new URL('jogos/' + dados.jogo + '/celular.html', location.href);
                destino.searchParams.set('familia', dados.familia);
                destino.searchParams.set('partida', dados.partida);
                location.href = destino.href;
            } catch (e) {
                erro.hidden = false;
                erro.textContent = Plataforma.erroAmigavel(e).includes('não encontrado') || /não encontrado/i.test(String(e.message || e))
                    ? 'Não achamos esse código. Confira a TV.'
                    : Plataforma.erroAmigavel(e);
            }
        });
    </script>
</body>
</html>
